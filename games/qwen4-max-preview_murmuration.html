<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a3e">
<link rel="icon" href="data:,">
<title>Murmuration — dusk flock</title>
<style>
  :root{
    --ink:#f4e9d8;
    --dim:rgba(244,233,216,.55);
    --faint:rgba(244,233,216,.32);
    --amber:#ffb45e;
    --amber-soft:rgba(255,180,110,.28);
    --panel:rgba(19,13,36,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#151a3e}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}

  /* ---------- title ---------- */
  #brand{position:absolute;top:22px;left:26px;line-height:1.25}
  #brand h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-style:italic;font-weight:400;font-size:26px;letter-spacing:.5px;
    color:var(--ink);text-shadow:0 2px 18px rgba(10,6,26,.8);
  }
  #brand .cap{
    margin-top:5px;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;
    color:var(--dim);text-shadow:0 1px 8px rgba(10,6,26,.8);
  }
  #hint{
    margin-top:10px;font-size:11.5px;color:var(--dim);max-width:300px;
    text-shadow:0 1px 8px rgba(10,6,26,.8);
    transition:opacity 1.2s ease;
  }
  #hint.quiet{opacity:.34}
  #hint b{color:var(--amber);font-weight:600}

  /* ---------- sound ---------- */
  #soundBtn{
    position:absolute;top:22px;right:24px;pointer-events:auto;
    width:38px;height:38px;border-radius:50%;
    background:var(--panel);border:1px solid var(--amber-soft);
    color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:border-color .25s,box-shadow .25s,transform .15s;
  }
  #soundBtn:hover{border-color:var(--amber);box-shadow:0 0 16px rgba(255,160,80,.25)}
  #soundBtn:active{transform:scale(.93)}
  #soundBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #soundBtn .off{display:none}
  #soundBtn.muted .on{display:none}
  #soundBtn.muted .off{display:block}
  #soundBtn.muted{color:var(--faint)}

  /* ---------- bottom console ---------- */
  #console{
    position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:11px;width:max-content;max-width:94vw;
  }
  #status{text-align:center;transition:opacity .4s;text-shadow:0 2px 14px rgba(10,6,26,.9)}
  #modeName{
    font-family:Georgia,"Iowan Old Style",serif;font-style:italic;
    font-size:17px;color:var(--amber);letter-spacing:.4px;
  }
  #modeLine{margin-top:3px;font-size:11.5px;color:var(--dim);letter-spacing:.3px}
  #chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .chip{
    pointer-events:auto;display:flex;align-items:center;gap:8px;
    padding:8px 14px 8px 9px;border-radius:999px;cursor:pointer;
    background:var(--panel);border:1px solid var(--amber-soft);color:var(--dim);
    font-size:12.5px;letter-spacing:.4px;font-family:inherit;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:border-color .25s,box-shadow .25s,color .25s,transform .12s;
  }
  .chip:hover{border-color:rgba(255,180,110,.6);color:var(--ink)}
  .chip:active{transform:scale(.95)}
  .chip .key{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:10.5px;padding:2.5px 7px;border-radius:6px;
    border:1px solid rgba(244,233,216,.3);color:var(--ink);
    background:rgba(244,233,216,.07);transition:all .25s;min-width:24px;text-align:center;
  }
  .chip.active{
    border-color:rgba(255,180,110,.85);color:var(--ink);
    box-shadow:0 0 22px rgba(255,160,80,.28);
  }
  .chip.active .key{background:var(--amber);border-color:var(--amber);color:#2a1631;font-weight:700}
  .chip.forming{animation:pulse 1.15s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 34px rgba(255,160,80,.55)}}

  #fps{
    position:absolute;right:24px;bottom:calc(18px + env(safe-area-inset-bottom));
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:10px;color:var(--faint);letter-spacing:.5px;text-shadow:0 1px 6px rgba(10,6,26,.8);
  }
  @media (max-width:640px){
    #brand{top:16px;left:18px}
    #brand h1{font-size:20px}
    #brand .cap{font-size:8.5px;letter-spacing:1.8px}
    #hint{font-size:10.5px;max-width:220px}
    #soundBtn{top:16px;right:16px;width:34px;height:34px}
    .chip{padding:7px 12px 7px 8px;font-size:11.5px}
    #modeName{font-size:15px}
    #fps{display:none}
  }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="A murmuration of eight hundred starlings over a dusk sky. Press F to form a fish, B to form a bird, Space for free flight."></canvas>

<div class="hud">
  <div id="brand">
    <h1>Murmuration</h1>
    <div class="cap">800 starlings · dusk over the marsh</div>
    <div id="hint">press <b>F</b>, <b>B</b> or <b>space</b> — tapping works too · move across the sky to stir the flock</div>
  </div>

  <button id="soundBtn" type="button" aria-label="Mute sound" title="Sound on — click to mute (M)">
    <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>

  <div id="console">
    <div id="status" aria-live="polite">
      <div id="modeName">free flight</div>
      <div id="modeLine">one mind with eight hundred wings</div>
    </div>
    <div id="chips">
      <button class="chip" type="button" data-mode="fish"><span class="key">F</span>fish</button>
      <button class="chip" type="button" data-mode="bird"><span class="key">B</span>bird</button>
      <button class="chip active" type="button" data-mode="free"><span class="key">space</span>free flight</button>
    </div>
  </div>

  <div id="fps">— fps · 800 birds</div>
</div>

<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f4e9d8">This murmuration needs JavaScript to fly.</div></noscript>

<script>
'use strict';
/* ============================================================
   MURMURATION — 800 boids over a procedural dusk marsh.
   F → fish outline · B → spread-winged bird · Space → free flock
   ============================================================ */

const N = 800;
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');

let W = 0, H = 0, prevW = 0, prevH = 0;
let userDPR = Math.min(2, window.devicePixelRatio || 1);
let DPR = userDPR;
let S = 1, horizonY = 0;
let shapeCx = 0, shapeCy = 0, fishScale = 1, birdScale = 1;

let bg, ov, glowCv, cloudA, cloudB, CW = 0;
let sprites = [];
let twinkles = [], shimmer = [];

/* ---- flock state (typed arrays) ---- */
const px = new Float32Array(N), py = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N);
const hd = new Float32Array(N);
const z  = new Float32Array(N), z0 = new Float32Array(N), zt = new Float32Array(N);
const rB = new Float32Array(N), rT = new Float32Array(N), dly = new Float32Array(N);
const tlx = new Float32Array(N), tly = new Float32Array(N);
const ws  = new Float32Array(N);
const jfx = new Float32Array(N), jfy = new Float32Array(N);
const jpx = new Float32Array(N), jpy = new Float32Array(N);
const npx = new Float32Array(N), npy = new Float32Array(N);
const flp = new Float32Array(N), flr = new Float32Array(N), gld = new Float32Array(N);
const fax = new Float32Array(N), fay = new Float32Array(N);

/* ---- spatial hash ---- */
let cell = 56, gw = 1, gh = 1, heads = new Int32Array(1), nxt = new Int32Array(N);
let R2 = 56*56, sepR2 = 21*21, neighborCap = 24;

/* ---- world / mode ---- */
let mode = 'free', tSim = 0, freeMax = 1;
let settled = 0, avgSp = 0, swell = 0, hudState = '';
let gust = { t: 5, active: false, p: 0, x: 0, y: 0, dx: 1, dy: 0 };
const pointer = { x: -9999, y: -9999, on: false };

const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const R = Math.random;

/* ============================================================
   SHAPES — hand-built bezier outlines, sampled by arc length
   ============================================================ */
const FISH = [
  [-0.97, 0.00, -0.90,-0.16, -0.72,-0.28, -0.52,-0.30],
  [-0.52,-0.30, -0.38,-0.36, -0.26,-0.38, -0.14,-0.38],
  [-0.14,-0.38, -0.10,-0.48, -0.02,-0.56,  0.04,-0.56],
  [ 0.04,-0.56,  0.10,-0.54,  0.18,-0.42,  0.24,-0.34],
  [ 0.24,-0.34,  0.36,-0.26,  0.48,-0.16,  0.56,-0.10],
  [ 0.56,-0.10,  0.74,-0.13,  0.86,-0.26,  0.96,-0.32],
  [ 0.96,-0.32,  0.90,-0.20,  0.82,-0.09,  0.80, 0.00],
  [ 0.80, 0.00,  0.82, 0.09,  0.90, 0.20,  0.96, 0.32],
  [ 0.96, 0.32,  0.86, 0.26,  0.74, 0.13,  0.56, 0.10],
  [ 0.56, 0.10,  0.44, 0.22,  0.26, 0.34,  0.06, 0.36],
  [ 0.06, 0.36,  0.00, 0.42, -0.05, 0.46, -0.10, 0.46],
  [-0.10, 0.46, -0.15, 0.45, -0.22, 0.39, -0.26, 0.33],
  [-0.26, 0.33, -0.42, 0.30, -0.56, 0.27, -0.68, 0.22],
  [-0.68, 0.22, -0.82, 0.16, -0.93, 0.09, -0.97, 0.00]
];
const BIRD_HALF = [
  [ 0.00,-0.80,  0.02,-0.78,  0.06,-0.72,  0.07,-0.64],
  [ 0.07,-0.64,  0.085,-0.60, 0.10,-0.56,  0.10,-0.52],
  [ 0.10,-0.52,  0.18,-0.58,  0.32,-0.66,  0.46,-0.66],
  [ 0.46,-0.66,  0.60,-0.66,  0.72,-0.62,  0.80,-0.56],
  [ 0.80,-0.56,  0.90,-0.53,  0.97,-0.50,  1.00,-0.46],
  [ 1.00,-0.46,  0.97,-0.42,  0.93,-0.39,  0.90,-0.38],
  [ 0.90,-0.38,  0.93,-0.34,  0.96,-0.30,  0.96,-0.26],
  [ 0.96,-0.26,  0.92,-0.23,  0.88,-0.22,  0.85,-0.22],
  [ 0.85,-0.22,  0.87,-0.18,  0.88,-0.14,  0.88,-0.10],
  [ 0.88,-0.10,  0.84,-0.08,  0.80,-0.09,  0.76,-0.10],
  [ 0.76,-0.10,  0.77,-0.06,  0.77,-0.02,  0.76, 0.02],
  [ 0.76, 0.02,  0.71, 0.02,  0.66, 0.00,  0.62,-0.02],
  [ 0.62,-0.02,  0.46,-0.06,  0.28, 0.02,  0.16, 0.06],
  [ 0.16, 0.06,  0.15, 0.14,  0.14, 0.22,  0.13, 0.30],
  [ 0.13, 0.30,  0.15, 0.40,  0.20, 0.48,  0.22, 0.56],
  [ 0.22, 0.56,  0.19, 0.60,  0.15, 0.61,  0.11, 0.60],
  [ 0.11, 0.60,  0.07, 0.60,  0.03, 0.62,  0.00, 0.62]
];

function samplePath(segs, count){
  const pts = [];
  for(let s=0;s<segs.length;s++){
    const g = segs[s];
    for(let k=(s===0?0:1);k<=24;k++){
      const u=k/24, v=1-u;
      pts.push(
        v*v*v*g[0]+3*v*v*u*g[2]+3*v*u*u*g[4]+u*u*u*g[6],
        v*v*v*g[1]+3*v*v*u*g[3]+3*v*u*u*g[5]+u*u*u*g[7]
      );
    }
  }
  const n = pts.length/2;
  const cum = new Float64Array(n); let tot = 0;
  for(let i=1;i<n;i++){
    tot += Math.hypot(pts[2*i]-pts[2*i-2], pts[2*i+1]-pts[2*i-1]);
    cum[i] = tot;
  }
  const out = new Float32Array(count*2); let seg = 1;
  for(let j=0;j<count;j++){
    const s = (j+0.5)*tot/count;
    while(seg<n-1 && cum[seg]<s) seg++;
    const l0=cum[seg-1], l1=cum[seg], f=(s-l0)/Math.max(1e-9,l1-l0);
    out[2*j]   = pts[2*(seg-1)]   + (pts[2*seg]  -pts[2*(seg-1)])  *f;
    out[2*j+1] = pts[2*(seg-1)+1] + (pts[2*seg+1]-pts[2*(seg-1)+1])*f;
  }
  return out;
}

let fishLocals, birdLocals;
function buildShapes(){
  const outline = samplePath(FISH, N-32);
  fishLocals = new Float32Array(N*2);
  fishLocals.set(outline, 0);
  let o = (N-32)*2;
  for(let k=0;k<14;k++){            // eye ring
    const a = k/14*Math.PI*2;
    fishLocals[o++] = -0.74 + Math.cos(a)*0.05;
    fishLocals[o++] = -0.07 + Math.sin(a)*0.05;
  }
  for(let k=0;k<18;k++){            // gill curve
    const u=k/17, v=1-u;
    fishLocals[o++] = v*v*-0.50 + 2*v*u*-0.36 + u*u*-0.52;
    fishLocals[o++] = v*v*-0.24 + 2*v*u*-0.02 + u*u* 0.20;
  }
  const full = BIRD_HALF.slice();
  for(let i=BIRD_HALF.length-1;i>=0;i--){
    const g = BIRD_HALF[i];
    full.push([-g[6],g[7], -g[4],g[5], -g[2],g[3], -g[0],g[1]]);
  }
  birdLocals = samplePath(full, N);
}

/* ============================================================
   BIRD SPRITES — 12 flap frames × 3 depth tints, warm rim light
   ============================================================ */
function birdPath(c, span, sweep){
  c.beginPath();
  c.moveTo(17,0);
  c.quadraticCurveTo(7,-3.4,-5,-2.1);
  c.lineTo(-15,-2.6); c.lineTo(-11,0); c.lineTo(-15,2.6); c.lineTo(-5,2.1);
  c.quadraticCurveTo(7,3.4,17,0);
  c.closePath();
  c.moveTo(5,-1);
  c.quadraticCurveTo(4-sweep*0.4,-span*0.55, 2-sweep,-span);
  c.quadraticCurveTo(-3-sweep*0.6,-span*0.5, -4,-1.2);
  c.closePath();
  c.moveTo(5,1);
  c.quadraticCurveTo(4-sweep*0.4,span*0.55, 2-sweep,span);
  c.quadraticCurveTo(-3-sweep*0.6,span*0.5, -4,1.2);
  c.closePath();
}
function makeSprites(){
  const cols = ['#3a2f55','#241b3e','#140f26'];
  sprites = [];
  for(let b=0;b<3;b++){
    const row = [];
    for(let f=0;f<12;f++){
      const c = document.createElement('canvas'); c.width = 64; c.height = 64;
      const g = c.getContext('2d');
      g.translate(32,32);
      const e = 0.5+0.5*Math.cos(f/12*Math.PI*2);
      birdPath(g, 6+16*e, 7*(1-e));
      g.fillStyle = cols[b];
      g.shadowColor = 'rgba(255,166,100,0.5)';
      g.shadowBlur = 5;
      g.fill();
      g.shadowBlur = 0;
      g.fill();
      row.push(c);
    }
    sprites.push(row);
  }
}

/* ============================================================
   DUSK BACKGROUND — baked once per resize
   ============================================================ */
function mkCv(w,h,scale){
  const c = document.createElement('canvas');
  c.width = Math.max(1,Math.round(w*scale)); c.height = Math.max(1,Math.round(h*scale));
  const g = c.getContext('2d'); g.scale(scale,scale);
  return [c,g];
}
function branch(g,x,y,a,len,w,d){
  const nx = x+Math.cos(a)*len, ny = y+Math.sin(a)*len;
  g.lineWidth = w; g.beginPath(); g.moveTo(x,y); g.lineTo(nx,ny); g.stroke();
  if(d>0 && len>4){
    const n = 2+(R()*2|0);
    for(let k=0;k<n;k++) branch(g,nx,ny,a+(R()-0.5)*1.1,len*(0.55+R()*0.2),w*0.6,d-1);
  }
}
function buildBackground(){
  const [c,g] = mkCv(W,H,DPR); bg = c;
  const sx = W*0.615, sy = horizonY-H*0.045, sr = Math.min(W,H)*0.052;

  const sky = g.createLinearGradient(0,0,0,horizonY);
  sky.addColorStop(0.00,'#151a3e'); sky.addColorStop(0.22,'#262a58');
  sky.addColorStop(0.42,'#453763'); sky.addColorStop(0.58,'#6f4468');
  sky.addColorStop(0.70,'#a35450'); sky.addColorStop(0.80,'#d4784b');
  sky.addColorStop(1.00,'#f0a05a');
  g.fillStyle = sky; g.fillRect(0,0,W,horizonY+2);

  // stars
  for(let i=0;i<170;i++){
    const x=R()*W, y=R()*H*0.60;
    const a=(1-y/(H*0.62))*(0.15+R()*0.55);
    g.fillStyle = 'rgba(255,233,201,'+a.toFixed(3)+')';
    const r = R()<0.85?1:1.6;
    g.fillRect(x,y,r,r);
    if(i<8){ g.fillRect(x-2.5,y+0.25,6,0.7); g.fillRect(x+0.25,y-2.5,0.7,6); }
  }
  // sun glow + disc
  let gl = g.createRadialGradient(sx,sy,0,sx,sy,sr*7);
  gl.addColorStop(0,'rgba(255,201,138,0.55)'); gl.addColorStop(0.35,'rgba(255,160,90,0.22)');
  gl.addColorStop(1,'rgba(255,160,90,0)');
  g.fillStyle = gl; g.fillRect(sx-sr*7,sy-sr*7,sr*14,sr*14);
  gl = g.createRadialGradient(sx-sr*0.2,sy-sr*0.2,sr*0.1,sx,sy,sr);
  gl.addColorStop(0,'#fff3da'); gl.addColorStop(0.7,'#ffdfae'); gl.addColorStop(1,'#ffc27e');
  g.fillStyle = gl; g.beginPath(); g.arc(sx,sy,sr,0,7); g.fill();

  // water
  const wat = g.createLinearGradient(0,horizonY,0,H);
  wat.addColorStop(0,'#4a3050'); wat.addColorStop(0.35,'#2c2044'); wat.addColorStop(1,'#120d26');
  g.fillStyle = wat; g.fillRect(0,horizonY,W,H-horizonY);
  g.save();
  g.translate(sx,horizonY+(H-horizonY)*0.35); g.scale(1,0.30);
  const rg = g.createRadialGradient(0,0,0,0,0,(H-horizonY)*1.15);
  rg.addColorStop(0,'rgba(255,170,90,0.34)'); rg.addColorStop(1,'rgba(255,170,90,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(0,0,(H-horizonY)*1.15,0,7); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(10,7,24,0.35)';
  for(let i=0;i<26;i++){
    const y = horizonY+4+R()*(H-horizonY-6), x = R()*W, l = 20+R()*120;
    g.lineWidth = 0.8+R(); g.globalAlpha = 0.15+R()*0.2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+l,y); g.stroke();
  }
  g.globalAlpha = 1;

  // hills
  const ridge = (base,a1,f1,p1,a2,f2,p2,a3,f3,col)=>{
    g.fillStyle = col; g.beginPath(); g.moveTo(0,H);
    for(let x=0;x<=W;x+=6){
      const y = base - a1*Math.sin(x*f1+p1) - a2*Math.sin(x*f2+p2) - a3*Math.sin(x*f3);
      g.lineTo(x,y);
    }
    g.lineTo(W,H); g.closePath(); g.fill();
  };
  ridge(horizonY-12,18,0.004,1,9,0.011,3,4,0.027,'#241a3d');
  ridge(horizonY-2,10,0.006,4,6,0.017,1,3,0.031,'#171129');

  // bare trees on the near ridge
  g.strokeStyle = '#171129'; g.lineCap = 'round';
  for(let i=0;i<6;i++){
    const x = W*(0.06+R()*0.88);
    const y = horizonY-2-10*Math.sin(x*0.006+4)-6*Math.sin(x*0.017+1);
    branch(g,x,y+3,-Math.PI/2+(R()-0.5)*0.3,14+R()*14,2.6,3);
  }
  // reeds at the water's edge
  g.strokeStyle = '#0e0a1e';
  for(let side=0;side<2;side++){
    for(let i=0;i<26;i++){
      const x = side===0 ? R()*100 : W-R()*100;
      const yb = horizonY+6+R()*12, h = 14+R()*34, lean = (R()-0.5)*14;
      g.lineWidth = 1+R()*0.8;
      g.beginPath(); g.moveTo(x,yb); g.quadraticCurveTo(x+lean*0.4,yb-h*0.6,x+lean,yb-h); g.stroke();
      if(R()<0.3){ g.fillStyle='#0e0a1e'; g.beginPath(); g.ellipse(x+lean,yb-h,1.8,5,lean*0.02,0,7); g.fill(); }
    }
  }
}

function makeCloudStrip(){

function buildSkyBits(){

/* ============================================================
   LAYOUT / RESIZE
   ============================================================ */
function layout(){
  S = clamp(Math.min(W,H)/820, 0.62, 1.5);
  horizonY = H*0.80;
  shapeCx = W*0.5; shapeCy = H*0.40;
  fishScale = Math.min(W*0.36, H*0.30, (horizonY-30-shapeCy)/0.60, (shapeCy-40)/0.60);
  birdScale = Math.min(W*0.42, H*0.335,(horizonY-30-shapeCy)/0.66, (shapeCy-40)/0.82);
  cell = 56*S; R2 = cell*cell; sepR2 = (21*S)*(21*S);
  gw = Math.max(1,Math.ceil(W/cell)+1); gh = Math.max(1,Math.ceil(H/cell)+1);
  heads = new Int32Array(gw*gh);
}
function rebuild(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(userDPR, window.devicePixelRatio || 1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  if(prevW>0 && prevH>0){
    const rx = W/prevW, ry = H/prevH;
    for(let i=0;i<N;i++){ px[i]*=rx; py[i]*=ry; }
  }
  prevW = W; prevH = H;
  layout();
  buildBackground(); buildOverlay(); buildClouds(); buildGlow(); buildSkyBits();
}

/* ============================================================
   FLOCK INIT
   ============================================================ */
function initFlock(){
  const cx0 = W*0.45, cy0 = H*0.40;
  for(let i=0;i<N;i++){
    const a = R()*Math.PI*2, rr = Math.sqrt(R());
    px[i] = cx0 + Math.cos(a)*rr*W*0.22;
    py[i] = cy0 + Math.sin(a)*rr*H*0.17;
    const sp = (100+R()*40)*S;
    vx[i] = -Math.sin(a)*sp + (R()-0.5)*30;
    vy[i] =  Math.cos(a)*sp + (R()-0.5)*30;
    hd[i] = Math.atan2(vy[i],vx[i]);
    z[i] = z0[i] = zt[i] = R();
    ws[i] = R();
    jfx[i] = 0.5+R()*0.9; jfy[i] = 0.5+R()*0.9;
    jpx[i] = R()*7; jpy[i] = R()*7;
    npx[i] = R()*7; npy[i] = R()*7;
    flp[i] = R(); flr[i] = 5+R()*3;
  }
}

/* ============================================================
   TARGET ASSIGNMENT — angle-sorted with best cyclic offset
   ============================================================ */
function assignTargets(key){
  const loc = key==='fish' ? fishLocals : birdLocals;
  const sc  = key==='fish' ? fishScale  : birdScale;
  let mx=0,my=0;
  for(let i=0;i<N;i++){ mx+=px[i]; my+=py[i]; }
  mx/=N; my/=N;
  const ab = new Float64Array(N), at = new Float64Array(N);
  for(let i=0;i<N;i++) ab[i] = Math.atan2(py[i]-my, px[i]-mx);
  for(let j=0;j<N;j++) at[j] = Math.atan2(loc[2*j+1], loc[2*j]);
  const idx = Array.from({length:N},(_,k)=>k);
  const ob = idx.slice().sort((a,b)=>ab[a]-ab[b]);
  const ot = idx.slice().sort((a,b)=>at[a]-at[b]);
  const bx=new Float64Array(N), by=new Float64Array(N);
  const tx=new Float64Array(N), ty=new Float64Array(N);
  for(let j=0;j<N;j++){
    bx[j]=px[ob[j]]; by[j]=py[ob[j]];
    tx[j]=shapeCx+loc[2*ot[j]]*sc; ty[j]=shapeCy+loc[2*ot[j]+1]*sc;
  }
  let best=0, bestC=Infinity;
  for(let off=0;off<N;off+=2){
    let c=0;
    for(let j=0;j<N;j++){
      const k=(j+off)%N, dx=bx[j]-tx[k], dy=by[j]-ty[k];
      c+=dx*dx+dy*dy;
    }
    if(c<bestC){ bestC=c; best=off; }
  }
  for(let j=0;j<N;j++){
    const bi=ob[j], tj=ot[(j+best)%N];
    tlx[bi]=loc[2*tj]; tly[bi]=loc[2*tj+1];
  }
}

   MODE / HUD

const chips = Array.from(document.querySelectorAll('.chip'));
const modeName = document.getElementById('modeName');
const modeLine = document.getElementById('modeLine');
const hint = document.getElementById('hint');
const fpsEl = document.getElementById('fps');

function updateHUD(state){
  if(state===hudState) return;
  hudState = state;
  let name='', line='', activeMode = mode, forming=false;
  if(state==='free'){ name='free flight'; line='one mind with eight hundred wings'; }
  else if(state==='form-fish'){ name='gathering — fish'; line='the flock remembers the sea'; forming=true; }
  else if(state==='hold-fish'){ name='the fish'; line='holding shape · tail swaying in the dusk'; }
  else if(state==='form-bird'){ name='gathering — bird'; line='wings fold into greater wings'; forming=true; }
  else { name='the bird'; line='holding shape · beating slowly, hugely'; }
  modeName.textContent = name;
  modeLine.textContent = line;
  chips.forEach(ch=>{
    ch.classList.toggle('active', ch.dataset.mode===activeMode);
    ch.classList.toggle('forming', forming && ch.dataset.mode===activeMode);
  });
}
function setMode(m){
  if(m===mode) return;
  const wasFree = mode==='free';
  mode = m; swell = 1;
  hint.classList.add('quiet');
  if(m!=='free'){
    assignTargets(m);
    for(let i=0;i<N;i++){
      rT[i]=1;
      dly[i]= wasFree ? R()*0.65 : R()*0.3;
      zt[i]=0.45+R()*0.25;
    }
    updateHUD('form-'+m);
  }else{
    for(let i=0;i<N;i++){
      rT[i]=0; dly[i]=R()*0.4; zt[i]=z0[i];
      const dx=px[i]-shapeCx, dy=py[i]-shapeCy, d=Math.hypot(dx,dy)+1e-3;
      vx[i]+=dx/d*50*S+(R()-0.5)*60*S;
      vy[i]+=dy/d*50*S+(R()-0.5)*60*S;
    }
    updateHUD('free');
  }
}

/* ============================================================
   AUDIO — synthesized wind + wing-wash, tied to flock motion
   ============================================================ */
let AC=null, master=null, wingGain=null, muted=false;
const soundBtn = document.getElementById('soundBtn');
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) { soundBtn.style.display='none'; return; }
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = muted?0:0.55; master.connect(AC.destination);
    const len = AC.sampleRate*2;
    const brown = AC.createBuffer(1,len,AC.sampleRate);
    const bd = brown.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=R()*2-1; last=(last+0.02*w)/1.02; bd[i]=last*3.5; }
    const white = AC.createBuffer(1,len,AC.sampleRate);
    const wd = white.getChannelData(0);
    for(let i=0;i<len;i++) wd[i]=(R()*2-1)*0.5;
    // wind
    const wsrc = AC.createBufferSource(); wsrc.buffer=brown; wsrc.loop=true;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=340; lp.Q.value=0.7;
    const wg = AC.createGain(); wg.gain.value=0.09;
    wsrc.connect(lp); lp.connect(wg); wg.connect(master); wsrc.start();
    const lfo = AC.createOscillator(); lfo.frequency.value=0.06;
    const lg = AC.createGain(); lg.gain.value=0.045;
    lfo.connect(lg); lg.connect(wg.gain); lfo.start();
    const lfo2 = AC.createOscillator(); lfo2.frequency.value=0.17;
    const lg2 = AC.createGain(); lg2.gain.value=0.02;
    lfo2.connect(lg2); lg2.connect(wg.gain); lfo2.start();
    // wing wash
    const asrc = AC.createBufferSource(); asrc.buffer=white; asrc.loop=true;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=850; bp.Q.value=0.8;
    wingGain = AC.createGain(); wingGain.gain.value=0;
    asrc.connect(bp); bp.connect(wingGain); wingGain.connect(master); asrc.start();
  }catch(e){ AC=null; soundBtn.style.display='none'; }
}
function setMuted(m){
  muted = m;
  soundBtn.classList.toggle('muted',m);
  soundBtn.setAttribute('aria-label', m?'Unmute sound':'Mute sound');
  soundBtn.title = m ? 'Sound off — click to unmute (M)' : 'Sound on — click to mute (M)';
  if(AC && master) master.gain.setTargetAtTime(m?0:0.55, AC.currentTime, 0.06);
}
soundBtn.addEventListener('click', ()=>{ initAudio(); setMuted(!muted); });
let audioAcc = 0;
function audioTick(dt){
  swell *= Math.exp(-dt*1.4);
  audioAcc += dt;
  if(audioAcc<0.15 || !AC || !wingGain || muted) return;
  audioAcc = 0;
  const agit = clamp((avgSp/S-100)/260, 0, 1);
  const target = 0.015 + agit*0.045 + swell*0.075;
  wingGain.gain.setTargetAtTime(target, AC.currentTime, 0.2);
}

/* ============================================================
   SIMULATION
   ============================================================ */
function simFree(){
  heads.fill(-1);
  const invCell = 1/cell;
  for(let i=0;i<N;i++){
    const cx0 = clamp((px[i]*invCell)|0, 0, gw-1);
    const cy0 = clamp((py[i]*invCell)|0, 0, gh-1);
    const ci = cy0*gw+cx0;
    nxt[i]=heads[ci]; heads[ci]=i;
  }
  const t = tSim;
  const Wx = W*(0.5+0.30*Math.sin(t*0.11+1.7)+0.08*Math.sin(t*0.043));
  const Wy = H*(0.38+0.16*Math.sin(t*0.083+0.5)+0.05*Math.sin(t*0.031));
  const swirl = Math.sin(t*0.05);
  const cruise=125*S, sepK=2400*S*S, sepCap=950*S, cap=1500*S;
  const m = 90*S, topM = m*0.8, bb = horizonY-14*S-m;

  // gust predator sweep
  if(!gust.active){
    gust.t -= 1/60;
    if(gust.t<=0 && mode==='free'){
      gust.active=true; gust.p=0;
      const side = R()<0.5?-1:1;
      gust.x = side<0 ? -100 : W+100;
      gust.y = H*(0.2+R()*0.4);
      gust.dx = -side; gust.dy = (R()-0.5)*0.4;
    }
  }else{
    gust.p += 1/60;
    gust.x += gust.dx*430*S/60; gust.y += gust.dy*430*S/60;
    if(gust.p>2.6){ gust.active=false; gust.t = 7+R()*8; }
  }
  const gR = 220*S, pR = 160*S;

  for(let i=0;i<N;i++){
    if(rB[i]>0.995){ fax[i]=0; fay[i]=0; continue; }
    const xi=px[i], yi=py[i];
    let cnt=0, avx=0, avy=0, cxs=0, cys=0, sx=0, sy=0;
    const cx0=clamp((xi*invCell)|0,0,gw-1), cy0=clamp((yi*invCell)|0,0,gh-1);
    const gy0=Math.max(0,cy0-1), gy1=Math.min(gh-1,cy0+1);
    const gx0=Math.max(0,cx0-1), gx1=Math.min(gw-1,cx0+1);
    for(let gy=gy0;gy<=gy1;gy++){
      for(let gx=gx0;gx<=gx1;gx++){
        let j=heads[gy*gw+gx];
        while(j!==-1){
          if(cnt>=neighborCap) break;
          if(j!==i){
            const dx=xi-px[j], dy=yi-py[j], d2=dx*dx+dy*dy;
            if(d2<R2){
              cnt++; avx+=vx[j]; avy+=vy[j]; cxs+=px[j]; cys+=py[j];
              if(d2<sepR2){ const inv=1/(d2+4); sx+=dx*inv; sy+=dy*inv; }
            }
          }
          j=nxt[j];
        }
      }
    }
    let ax=0, ay=0;
    if(cnt>0){
      const mV = Math.hypot(avx,avy);
      if(mV>0.001){ ax+=(avx/mV*cruise-vx[i])*1.9; ay+=(avy/mV*cruise-vy[i])*1.9; }
      ax+=(cxs/cnt-xi)*1.05; ay+=(cys/cnt-yi)*1.05;
      let spx=sx*sepK, spy=sy*sepK;
      const sm=Math.hypot(spx,spy);
      if(sm>sepCap){ spx*=sepCap/sm; spy*=sepCap/sm; }
      ax+=spx; ay+=spy;
    }
    const dxw=Wx-xi, dyw=Wy-yi, dw=Math.hypot(dxw,dyw)+1e-6;
    ax += dxw/dw*16*S - dyw/dw*30*S*swirl;
    ay += dyw/dw*16*S + dxw/dw*30*S*swirl;
    ax += Math.sin(t*1.7+npx[i])*26*S;
    ay += Math.cos(t*1.3+npy[i])*26*S;
    if(xi<m) ax+=(m-xi)*8;
    if(xi>W-m) ax-=(xi-(W-m))*8;
    if(yi<topM) ay+=(topM-yi)*8;
    if(yi>bb) ay-=(yi-bb)*8;
    if(gust.active){
      const dx=xi-gust.x, dy=yi-gust.y, d=Math.hypot(dx,dy);
      if(d<gR && d>0.01){ const f=1000*S*(1-d/gR); ax+=dx/d*f; ay+=dy/d*f; }
    }
    if(pointer.on){
      const dx=xi-pointer.x, dy=yi-pointer.y, d=Math.hypot(dx,dy);
      if(d<pR && d>0.01){ const f=900*S*(1-d/pR); ax+=dx/d*f; ay+=dy/d*f; }
    }
    const am=Math.hypot(ax,ay);
    if(am>cap){ ax*=cap/am; ay*=cap/am; }
    fax[i]=ax; fay[i]=ay;
  }
}

function simStep(dt){
  const t = tSim;
  if(freeMax>0.005) simFree();
  const formed = mode!=='free';
  const sc = mode==='fish'?fishScale:birdScale;
  const bobPx = Math.sin(t*0.5)*6*S;
  let rollC=1, rollS=0, surge=0, beat=0, beat2=0, bobL=0, tailS=0;
  if(mode==='fish'){
    const roll = 0.03*Math.sin(t*0.7);
    rollC=Math.cos(roll); rollS=Math.sin(roll);
    surge=0.012*Math.sin(t*1.1);
  }else if(mode==='bird'){
    beat=Math.sin(t*1.4); beat2=Math.sin(t*1.4+1.57);
    bobL=0.008*Math.sin(t*0.8); tailS=Math.sin(t*0.9)*0.012;
  }
  const maxFree=185*S, maxForm=560*S, minFree=72*S;
  let settledCnt=0, spSum=0, fMax=0;

  for(let i=0;i<N;i++){
    if(dly[i]>0) dly[i]-=dt;
    else{
      const rate = rT[i]>rB[i] ? dt/0.85 : dt/0.6;
      rB[i] = clamp(rB[i]+(rT[i]>rB[i]?rate:-rate), 0, 1);
    }
    const r=rB[i], b=r*r*(3-2*r);
    if(1-b>fMax) fMax=1-b;

    let ax=fax[i]*(1-b), ay=fay[i]*(1-b);
    if(formed){
      let lx=tlx[i], ly=tly[i];
      if(mode==='fish'){
        const w=clamp((lx+0.15)/1.1,0,1);
        ly += Math.sin(t*2.3-(lx+1)*2.2)*(0.012+0.07*w);
        lx += surge;
        const rx=lx*rollC-ly*rollS, ry=lx*rollS+ly*rollC;
        lx=rx; ly=ry;
      }else{
        const w=Math.pow(Math.min(1,Math.abs(lx)),1.4);
        ly += beat*0.055*w + bobL;
        lx *= 1+0.012*beat2*w;
        if(ly>0.3) lx += tailS*((ly-0.3)/0.32);
      }
      const jx=(Math.sin(t*jfx[i]+jpx[i])+0.5*Math.sin(t*0.53+jpy[i]))*2.2*S;
      const jy=(Math.cos(t*jfy[i]+jpy[i])+0.5*Math.sin(t*0.61+jpx[i]))*2.2*S;
      const Tx=shapeCx+lx*sc+jx, Ty=shapeCy+ly*sc+bobPx+jy;
      let om=2.3+0.7*ws[i]; om+=(3.4-om)*r;
      ax += ((Tx-px[i])*om*om - vx[i]*2*om)*b;
      ay += ((Ty-py[i])*om*om - vy[i]*2*om)*b;
      const ddx=Tx-px[i], ddy=Ty-py[i];
      if(r>0.9 && ddx*ddx+ddy*ddy < 81*S*S) settledCnt++;
    }
    vx[i]+=ax*dt; vy[i]+=ay*dt;
    const mx=maxFree+(maxForm-maxFree)*b, mn=minFree*(1-b);
    let sp=Math.hypot(vx[i],vy[i]);
    if(sp>mx){ vx[i]*=mx/sp; vy[i]*=mx/sp; sp=mx; }
    else if(sp<mn){
      if(sp>0.001){ vx[i]*=mn/sp; vy[i]*=mn/sp; }
      else{ const a=R()*7; vx[i]=Math.cos(a)*mn; vy[i]=Math.sin(a)*mn; }
      sp=mn;
    }
    px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
    if(px[i]<-60){px[i]=-60; vx[i]=Math.abs(vx[i]);}
    if(px[i]>W+60){px[i]=W+60; vx[i]=-Math.abs(vx[i]);}
    if(py[i]<-60){py[i]=-60; vy[i]=Math.abs(vy[i]);}
    if(py[i]>horizonY+40){py[i]=horizonY+40; vy[i]=-Math.abs(vy[i]);}
    spSum+=sp;
    z[i]+=(zt[i]-z[i])*Math.min(1,dt*1.5);
    // heading smoothing
    if(sp>2){
      const ta=Math.atan2(vy[i],vx[i]);
      let da=ta-hd[i];
      da=((da+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      hd[i]+=da*Math.min(1,dt*7);
    }
    // wings
    const rate=(flr[i]+sp/(90*S))*(1-b)+(2.0+1.5*ws[i])*b;
    flp[i]=(flp[i]+dt*rate)%1;
    if(gld[i]>0) gld[i]-=dt;
    else if(b<0.4 && R()<dt*0.10) gld[i]=0.4+R()*0.9;
  }
  freeMax=fMax;
  avgSp=spSum/N;
  const frac=formed?settledCnt/N:0;
  settled+=(frac-settled)*Math.min(1,dt*2);
  if(formed && settled>0.9) updateHUD('hold-'+mode);
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const t=tSim;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;
  ctx.drawImage(bg,0,0,W,H);

  // drifting clouds
  let x1=-((t*6)%CW), x2=-((t*11)%CW);
  ctx.globalAlpha=0.85;
  ctx.drawImage(cloudA,x1,H*0.14); ctx.drawImage(cloudA,x1+CW,H*0.14);
  ctx.globalAlpha=0.6;
  ctx.drawImage(cloudB,x2,H*0.38); ctx.drawImage(cloudB,x2+CW,H*0.38);

  // twinkling stars
  ctx.fillStyle='#ffe9c9';
  for(let i=0;i<twinkles.length;i++){
    const s=twinkles[i];
    ctx.globalAlpha=s.a*(0.55+0.45*Math.sin(t*s.f+s.p));
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  // water glitter
  ctx.fillStyle='rgb(255,190,120)';
  for(let i=0;i<shimmer.length;i++){
    const s=shimmer[i];
    const a=0.10+0.14*Math.sin(t*s.f+s.p);
    if(a<=0) continue;
    ctx.globalAlpha=a;
    ctx.fillRect(s.x-s.w/2+Math.sin(t*0.7+s.p)*3, s.y, s.w, 1.4);
  }
  // backlight behind a held shape
  if(mode!=='free' && settled>0.05){
    const sc=mode==='fish'?fishScale:birdScale, gs=sc*3.2;
    ctx.globalAlpha=0.10*settled;
    ctx.drawImage(glowCv, shapeCx-gs/2, shapeCy+Math.sin(t*0.5)*6*S-gs/2, gs, gs);
  }

  // birds
  const inv64=1/64;
  for(let i=0;i<N;i++){
    const zi=z[i];
    const band = zi<0.36?0 : zi<0.7?1 : 2;
    const r=rB[i], b=r*r*(3-2*r);
    const frame = gld[i]>0 ? 0 : (flp[i]*12)|0;
    const spr = sprites[band][frame];
    const L=(15+9*zi)*S*(1-0.16*b);
    const k=L*inv64;
    const sp=Math.hypot(vx[i],vy[i]);
    const stretch=Math.min(0.45, sp/(650*S));
    const kx=k*(1+stretch), ky=k*(1-0.3*stretch);
    const c=Math.cos(hd[i]), s=Math.sin(hd[i]);
    ctx.globalAlpha = band===0?0.78 : band===1?0.9 : 1;
    ctx.setTransform(DPR*c*kx, DPR*s*kx, -DPR*s*ky, DPR*c*ky, DPR*px[i], DPR*py[i]);
    ctx.drawImage(spr,-32,-32);
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;
  ctx.drawImage(ov,0,0,W,H);
}

/* ============================================================
   MAIN LOOP — adaptive quality, fps meter
   ============================================================ */
let last=performance.now(), emaDt=1/60, frameCnt=0, fpsAcc=0, fpsFrames=0, adaptCnt=0;
function frame(now){
  const real=(now-last)/1000; last=now;
  const dt=Math.min(0.033, Math.max(0.0001, real));
  tSim+=dt;
  simStep(dt);
  render();
  audioTick(dt);

  emaDt=emaDt*0.95+Math.min(real,0.1)*0.05;
  fpsAcc+=real; fpsFrames++;
  if(fpsAcc>=0.5){
    fpsEl.textContent=Math.round(fpsFrames/fpsAcc)+' fps · 800 birds';
    fpsAcc=0; fpsFrames=0;
  }
  if(++adaptCnt>=120){
    adaptCnt=0;
    if(emaDt>0.0195 && userDPR>1.05){ userDPR=Math.max(1,userDPR-0.25); rebuild(); }
    else if(emaDt>0.024 && neighborCap>12){ neighborCap=12; }
  }
  frameCnt++;
  requestAnimationFrame(frame);
}

/* ============================================================
   BOOT
   ============================================================ */
buildShapes();
makeSprites();
rebuild();
initFlock();
updateHUD('free');
requestAnimationFrame(frame);
</script>
